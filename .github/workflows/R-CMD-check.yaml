# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Standard R CMD check on the three major platforms.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  distro-rcpp:
    name: Ubuntu 24.04 distro Rcpp and concurrent cache
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install using the distro R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-dev r-cran-rcpp r-cran-ape r-cran-digest
          mkdir -p "$RUNNER_TEMP/r-lib"
          export R_LIBS_USER="$RUNNER_TEMP/r-lib"
          /usr/bin/Rscript --vanilla -e 'print(packageVersion("Rcpp"))'
          /usr/bin/R CMD INSTALL --library="$R_LIBS_USER" .
          /usr/bin/Rscript --vanilla tests/namespace-oracle.R
      - name: Exercise concurrent loads under the hard cache budget
        run: |
          c++ -std=c++17 -pthread -Isrc .github/recert/engine002_lru_overlap.cpp \
            src/engine002_{lru,fast_hash,hash}.cpp -o "$RUNNER_TEMP/test-lru"
          "$RUNNER_TEMP/test-lru"

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install a comma-decimal locale for the parser test
        if: runner.os == 'Linux'
        run: sudo locale-gen de_DE.UTF-8

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Check installed backend, license and release metadata
        shell: Rscript {0}
        run: |
          checks <- list.dirs("check", recursive = TRUE, full.names = TRUE)
          libs <- checks[basename(checks) == "SplitAlignerR.Rcheck"]
          stopifnot(length(libs) == 1L, dir.exists(file.path(libs, "SplitAlignerR")))
          .libPaths(c(normalizePath(libs), .libPaths()))
          args <- c(shQuote(".github/recert/release_metadata_gate.R"),
                    shQuote("."), shQuote(file.path(tempdir(), "release-metadata.tsv")))
          Sys.setenv(R_LIBS = paste(.libPaths(), collapse = .Platform$path.sep))
          stopifnot(system2(file.path(R.home("bin"), "Rscript"), args) == 0L)
